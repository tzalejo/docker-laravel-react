server {
    listen 80;
    index index.php index.html;
    server_name localhost;
    root /var/www/html/public;

    # DNS embebido de Docker: resuelve "php" en cada request en vez de una
    # sola vez al arrancar, para no perder la carrera contra el adjuntado
    # de red del contenedor y quedar crasheado con "host not found in upstream".
    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        set $php_upstream php:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
